{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="centered card">
  <h1>Change password</h1>
  <p class="muted">Minimum 12 characters.</p>
  <form method="post" class="stacked">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Update password</button>
  </form>
</div>
{% endblock %}
